name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  connectors:
    name: Connector conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt ruff==0.17.1
      - name: Lint Python tooling
        run: |
          ruff check tools/
          ruff format --check tools/
      - name: Connector golden tests
        run: python tools/validate.py
