name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service:
    name: Service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: cashflow/uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check
      - name: Tests (incl. connector conformance)
        run: uv run --frozen pytest --cov
